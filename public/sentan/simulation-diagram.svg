<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="実世界と数理世界を結ぶモデリングとシミュレーションの概念図">
  <defs>
    <style>
      .title{font:700 34px system-ui, -apple-system, Segoe UI, sans-serif; fill:#111827}
      .sub{font:600 20px system-ui, -apple-system, Segoe UI, sans-serif; fill:#111827}
      .txt{font:500 18px system-ui, -apple-system, Segoe UI, sans-serif; fill:#111827}
      .muted{font:500 16px system-ui, -apple-system, Segoe UI, sans-serif; fill:#374151}
      .box{fill:#f3f4f6; stroke:#111827; stroke-width:2; rx:14}
      .panel{fill:#ffffff; stroke:#111827; stroke-width:3; rx:16}
      .accent{fill:#e5e7eb; stroke:#111827; stroke-width:2; rx:12}
      .arrow{stroke:#2563eb; stroke-width:3; fill:none; marker-end:url(#m)}
      .arrowRed{stroke:#dc2626; stroke-width:6; fill:none; marker-end:url(#mr)}
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12" fill="#2563eb" />
    </marker>
    <marker id="mr" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Frame -->
  <rect x="24" y="24" width="1152" height="552" class="panel" />
  <text x="60" y="80" class="title">実世界と数理世界を結ぶモデリングとシミュレーション</text>
  <text x="60" y="115" class="muted">（先端情報学実習：シミュレーション・プロジェクト）</text>

  <!-- Left: Human internal process -->
  <text x="90" y="170" class="sub">人間内部の状態・プロセス</text>
  <rect x="70" y="190" width="360" height="290" class="box" />

  <!-- Chips -->
  <g class="txt">
    <rect x="95" y="220" width="150" height="44" class="accent" />
    <text x="115" y="249">記憶</text>

    <rect x="260" y="220" width="150" height="44" class="accent" />
    <text x="280" y="249">知覚</text>

    <rect x="95" y="275" width="150" height="44" class="accent" />
    <text x="115" y="304">思考</text>

    <rect x="260" y="275" width="150" height="44" class="accent" />
    <text x="280" y="304">学習</text>

    <rect x="95" y="330" width="150" height="44" class="accent" />
    <text x="115" y="359">感情</text>

    <rect x="260" y="330" width="150" height="44" class="accent" />
    <text x="280" y="359">言語</text>

    <rect x="95" y="385" width="315" height="44" class="accent" />
    <text x="115" y="414">意思決定・探索・問題解決</text>
  </g>

  <!-- Center: experiment/model match -->
  <text x="520" y="170" class="sub">実験</text>
  <path d="M560,180 C560,210 470,210 470,240" class="arrow" />
  <path d="M640,180 C640,210 760,210 760,240" class="arrow" />

  <text x="520" y="260" class="sub">マッチ？</text>
  <polygon points="600,280 680,320 600,360 520,320" fill="#d1d5db" stroke="#111827" stroke-width="2" />

  <rect x="500" y="390" width="280" height="110" class="box" />
  <text x="530" y="430" class="txt">評価指標</text>
  <text x="530" y="460" class="muted">反応時間・正答率・生理指標 など</text>

  <!-- Right: formal representations -->
  <text x="810" y="170" class="sub">コンピュータ内の形式表現</text>
  <rect x="780" y="190" width="360" height="290" class="box" />

  <g class="txt">
    <rect x="805" y="220" width="310" height="44" class="accent" />
    <text x="825" y="249">プロダクションルール</text>

    <rect x="805" y="275" width="310" height="44" class="accent" />
    <text x="825" y="304">ニューラルネット</text>

    <rect x="805" y="330" width="310" height="44" class="accent" />
    <text x="825" y="359">ベイジアンネット / 強化学習</text>

    <rect x="805" y="385" width="310" height="44" class="accent" />
    <text x="825" y="414">認知アーキテクチャ</text>
  </g>

  <!-- Red behavior arrows -->
  <text x="430" y="310" class="sub" fill="#dc2626">行動</text>
  <path d="M450,325 C420,410 470,455 500,445" class="arrowRed" />

  <text x="720" y="310" class="sub" fill="#dc2626">行動</text>
  <path d="M760,325 C790,410 740,455 780,445" class="arrowRed" />

  <!-- Prediction label -->
  <text x="705" y="135" class="sub" fill="#dc2626">予測</text>
  <path d="M760,140 C730,150 700,160 660,175" class="arrow" />

  <!-- Footer tagline -->
  <text x="170" y="545" class="sub">情報技術により人を知り、人と調和する情報技術へ</text>
</svg>
